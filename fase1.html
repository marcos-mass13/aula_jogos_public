<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" href="hud/hud_style.css">
</head>

<body>
    <div class="game-wrpper">
        <div class="hud-top">
            <div class="panel">
                <div class="hearts" id="hearts"></div>
            </div>
            <div class="panel">
                <div class="coin-icon">
                    <svg viewBox="0 0 64 64">
                        <circle cx="32" cy="32" r="28" fill="gold" stroke="brown" stroke-width="4" />
                    </svg>
                </div>
                <div class="coin-count" id="coin-count">0</div>
            </div>
        </div>
        <div class="play-area">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
        </div>
        <div class="controls">
            <button id="btn-damage">Dano(J)</button>
            <button id="btn-heal">Cura (H)</button>
            <button id="btn-coin">+1 Moeda (K)</button>
            <button id="btn-reset">Reset (L)</button>
        </div>
    </div>


    <audio src="audio/musicaFundo.mp3" id="musicaFundo"></audio>
    <audio src="audio/somTiro.mp3" id="somTiro"></audio>
    <audio src="audio/somPulo.mp3" id="somPulo"></audio>


    <script src="entidade.js"></script>
    <script src="inimigo.js"></script>
    <script src="jogador.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>


</html>
